labels:
  platform: linux/amd64
when:
- event: push
  branch:
  - '**'
  path:
    include:
    - packages/typescript/**
    - contract/**
    - biome.json
    - package.json
    - .woodpecker/**
- event: pull_request
  path:
    include:
    - packages/typescript/**
    - contract/**
    - biome.json
    - package.json
    - .woodpecker/**
clone:
- name: git
  image: docker.io/woodpeckerci/plugin-git:2.12.1
  settings:
    partial: false
    depth: 1
steps:
- name: typescript
  image: localhost/woodpecker/toolbox:personal-3
  commands:
  - timeout --kill-after=30s 360m bash .woodpecker/scripts/ci-typescript.sh
