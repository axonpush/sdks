name: Publish AxonPush (NuGet)

on:
  push:
    tags: ["sdk-dotnet-v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Tag matches Directory.Build.props
        run: |
          tag="${GITHUB_REF_NAME#sdk-dotnet-v}"
          pkg="$(grep -o '<VersionPrefix>[^<]*' Directory.Build.props | sed 's/.*>//')"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != VersionPrefix $pkg"; exit 1; }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/dotnet/artifacts/*.nupkg
          generate_release_notes: true
