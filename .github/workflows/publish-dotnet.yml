name: Publish AxonPush (NuGet)

on:
  push:
    tags: ["sdk-dotnet-v*"]

permissions:
  contents: write
  # NuGet/login exchanges this for a short-lived API key
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: bun run tools/check-versions.ts
        working-directory: ${{ github.workspace }}
      - name: Tag matches Directory.Build.props
        run: |
          tag="${GITHUB_REF_NAME#sdk-dotnet-v}"
          pkg="$(grep -o '<VersionPrefix>[^<]*' Directory.Build.props | sed 's/.*>//')"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != VersionPrefix $pkg"; exit 1; }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts
      # Trusted publishing: NuGet/login trades the workflow's OIDC identity for
      # an API key that expires in minutes, so there is no NUGET_API_KEY to
      # store or rotate. Needs a trusted publishing policy on nuget.org naming
      # this repository and workflow.
      - name: Exchange OIDC for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: axonpush
      - name: Push to NuGet
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/dotnet/artifacts/*.nupkg
          generate_release_notes: true
